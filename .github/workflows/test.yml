name: Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Tests & Code Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java SDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create dummy .env for CI build
        run: |
          cat <<EOF > .env
          APPWRITE_ENDPOINT=https://ci-placeholder.example.com/v1
          APPWRITE_PROJECT_ID=ci-placeholder-project
          APPWRITE_DATABASE_ID=ci-placeholder-database
          APPWRITE_TABLE_ID=ci-placeholder-table
          APPWRITE_USER_TABLE_ID=ci-placeholder-users
          APPWRITE_BUCKET_ID=ci-placeholder-bucket
          APPWRITE_API_KEY=ci-placeholder-api-key
          EOF

      - name: Generate env.g.dart
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run unit and widget tests
        run: flutter test --coverage

